services:
  ollama:
    image: ollama/ollama:latest
    container_name: esg-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: esg-app
    # Plus de "ports: 8501:8501" — l'app n'est plus exposée directement à
    # l'extérieur (checklist.md, 2026-08-06 : accès sans authentification
    # jugé insuffisant pour un usage réel). Seul Caddy est publié ; il
    # atteint "app" via le réseau Docker interne (nom de service, port 8501)
    # sans avoir besoin de "ports:" pour ça — "ports:" ne sert qu'à exposer
    # au host/à l'extérieur, pas à la communication inter-containers.
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./corpus:/app/corpus
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # CHANTIER LLM BACKEND (2026-08-07, checklist.md) — voir
      # scripts/llm_backend.py. ${VAR:-defaut} lu depuis le .env à la racine
      # (gitignored) par docker-compose, pas de clé en dur ici.
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LLM_MODEL=${LLM_MODEL:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - LLM_FALLBACK=${LLM_FALLBACK:-ollama}
      - LLM_RATE_LIMIT=${LLM_RATE_LIMIT:-10}
    depends_on:
      ollama:
        condition: service_healthy

  # Reverse proxy + authentification (checklist.md, 2026-08-06) — point
  # d'entrée unique. HTTP simple pour l'instant (pas de domaine fonctionnel
  # avec DNS propre, cf. souci AAAA/IPv6 non résolu) ; 443 déjà exposé pour
  # activer HTTPS plus tard sans re-toucher ce fichier (juste remplacer le
  # bloc ":80" du Caddyfile par le nom de domaine — Caddy gère alors
  # Let's Encrypt automatiquement).
  caddy:
    image: caddy:2
    container_name: esg-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
